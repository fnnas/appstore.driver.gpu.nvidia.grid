name: NVIDIA GRID Kernel Source

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      driver_pkg_artifact:
        required: true
        type: string
        default: "nvidia-grid-kernel-src"
      firmware_artifact:
        required: true
        type: string
        default: "nvidia-grid-firmware"
      runfile_artifact:
        required: true
        type: string
        default: "nvidia-grid-runfile"
      this_pack_grid_url:
        required: true
        type: string
      this_pack_grid_run:
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Restore NVIDIA driver cache
        id: cache-grid-driver
        uses: actions/cache@v5
        with:
          path: downloads/${{ inputs.this_pack_grid_run }}
          key: nvidia-grid-driver-${{ inputs.this_pack_grid_run }}

      - name: Download NVIDIA driver
        if: steps.cache-grid-driver.outputs.cache-hit != 'true'
        run: |
          mkdir -p downloads
          curl -fL --retry 5 --retry-delay 10 -o "downloads/${{ inputs.this_pack_grid_run }}" "${{ inputs.this_pack_grid_url }}"

      - name: Extract NVIDIA kernel source
        run: |
          test -s "downloads/${{ inputs.this_pack_grid_run }}"
          chmod +x "downloads/${{ inputs.this_pack_grid_run }}"
          rm -rf drvpkg nvidia-kernel-src.tgz
          "./downloads/${{ inputs.this_pack_grid_run }}" --extract-only --target drvpkg
          test -d drvpkg/kernel
          test -d drvpkg/firmware
          if ! python3 scripts/patch-nvidia-grid-kernel-binary.py drvpkg/kernel/nvidia/nv-kernel.o_binary; then
            echo "::warning::NVIDIA GRID kernel binary patch script failed; continuing with current kernel source. Check previous log lines for the failed rule or file path."
          fi
          tar zcf nvidia-kernel-src.tgz -C drvpkg kernel

      - name: Upload NVIDIA kernel source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.driver_pkg_artifact }}
          path: nvidia-kernel-src.tgz

      - name: Upload NVIDIA firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.firmware_artifact }}
          path: drvpkg/firmware

      - name: Upload NVIDIA runfile
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.runfile_artifact }}
          path: downloads/${{ inputs.this_pack_grid_run }}
