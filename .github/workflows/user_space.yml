name: User Space

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      this_pack_version:
        required: true
        type: string
      this_pack_nvidia_driver_version:
        required: true
        type: string
      this_pack_nvidia_driver_page_url:
        required: true
        type: string
      this_pack_grid_run:
        required: true
        type: string
      runfile_artifact:
        required: true
        type: string
        default: "nvidia-grid-runfile"
      nvlts_artifact:
        required: false
        type: string
        default: ""
      enable_nvlts:
        required: false
        type: boolean
        default: false
      manifest_platform:
        required: true
        type: string
        default: "x86"

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Restore NVIDIA runfile artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.runfile_artifact }}
          path: app/app/

      - name: Normalize NVIDIA runfile name
        run: |
          test -f "app/app/${{ inputs.this_pack_grid_run }}"
          chmod +x "app/app/${{ inputs.this_pack_grid_run }}"

      - name: Restore NVLTS
        if: ${{ inputs.enable_nvlts }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.nvlts_artifact }}
          path: app/app/nvlts/

      - name: Verify NVLTS artifact
        if: ${{ inputs.enable_nvlts }}
        run: |
          test -f app/app/nvlts/nvlts
          test -d app/app/nvlts/configs
          chmod +x app/app/nvlts/nvlts

      - name: Render user-space package manifest
        run: |
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_user_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_user_space/manifest
          sed "s|this_pack_nvidia_driver_page_url|${{ inputs.this_pack_nvidia_driver_page_url }}|g" -i ./package_user_space/manifest
          sed "s/this_pack_manifest_platform/${{ inputs.manifest_platform }}/g" -i ./package_user_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_user_space/cmd/common
          sed "s/this_pack_grid_run/${{ inputs.this_pack_grid_run }}/g" -i ./package_user_space/cmd/common
          sed "s/this_pack_enable_nvlts/${{ inputs.enable_nvlts }}/g" -i ./package_user_space/cmd/common
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_user_space/wizard/install
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_user_space/wizard/install

      - name: Create user-space app payload archive
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../package_user_space/

      - name: Create user-space package archive
        run: |
          tar zcvf nvidia.user-${{ inputs.this_pack_version }}-${{ inputs.manifest_platform }}.tgz package_user_space

      - name: Upload user-space package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvidia.user-${{ inputs.this_pack_version }}-${{ inputs.manifest_platform }}.tgz
          path: nvidia.user-${{ inputs.this_pack_version }}-${{ inputs.manifest_platform }}.tgz
