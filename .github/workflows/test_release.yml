name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Do you want to create a release?"
        required: true
        type: boolean
        default: false
      enable_ccache:
        description: "Do you want to enable ccache?"
        required: true
        type: boolean
        default: true
      build_580:
        description: "是否构建 580.159.03?"
        required: true
        type: boolean
        default: true
      build_535:
        description: "是否构建 535.309.01?"
        required: true
        type: boolean
        default: true

env:
  proj_name: "appstore.driver.gpu.nvidia.grid"
  kernel_module_package_name: "appstore.driver.gpu.nvidia.ko"

jobs:
  validate_version_matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Validate driver version matrix
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/test_release.yml").read_text(encoding="utf-8")
          expected = {
              ("580.159.03-3", "580.159.03"),
              ("535.309.01-1", "535.309.01"),
          }
          pairs = set(re.findall(
              r'"this_pack_version": "([^"]+)",\n\s+"this_pack_nvidia_driver_version": "([^"]+)"',
              workflow,
              flags=re.M,
          ))
          if pairs != expected:
              print(f"Unexpected package/driver pairs: {sorted(pairs)}")
              raise SystemExit(1)

          kernels = set(re.findall(r'"(6[.]18[.]18(?:[.]c(?:788|877|938))?-trim(?:-(?:427|570|587|717))?-amd64)"', workflow))
          expected_kernels = {
              "6.18.18-trim-427-amd64",
              "6.18.18-trim-570-amd64",
              "6.18.18-trim-587-amd64",
              "6.18.18-trim-717-amd64",
              "6.18.18.c788-trim-amd64",
              "6.18.18.c877-trim-amd64",
              "6.18.18.c938-trim-amd64",
          }
          if kernels != expected_kernels:
              print(f"Unexpected kernel package suffixes: {sorted(kernels)}")
              raise SystemExit(1)
          chroot_assets = re.findall(
              r'^\s+"package_name_suffix": "chroot-amd64",$',
              workflow,
              flags=re.M,
          )
          if len(chroot_assets) != 1:
              print("Expected exactly one chroot-amd64 release asset definition")
              raise SystemExit(1)
          PY

  plan_build:
    runs-on: ubuntu-latest
    needs:
      - validate_version_matrix
    outputs:
      build_580: ${{ steps.plan.outputs.build_580 }}
      build_535: ${{ steps.plan.outputs.build_535 }}
      driver_matrix: ${{ steps.plan.outputs.driver_matrix }}
      nvlts_matrix: ${{ steps.plan.outputs.nvlts_matrix }}
      user_matrix: ${{ steps.plan.outputs.user_matrix }}
      release_assets_matrix: ${{ steps.plan.outputs.release_assets_matrix }}
      selected_driver_regex: ${{ steps.plan.outputs.selected_driver_regex }}
      selected_driver_summary: ${{ steps.plan.outputs.selected_driver_summary }}
    steps:
      - name: Plan selected driver builds
        id: plan
        env:
          BUILD_580: ${{ inputs.build_580 }}
          BUILD_535: ${{ inputs.build_535 }}
        run: |
          python3 - <<'PY'
          import json
          import os

          drivers = [
              {
                  "enabled": os.environ["BUILD_580"] == "true",
                  "this_pack_version": "580.159.03-3",
                  "this_pack_nvidia_driver_version": "580.159.03",
                  "this_pack_nvidia_driver_page_url": "https://www.nvidia.com/en-us/drivers/details/267577/",
                  "this_pack_grid_download_url": "https://alist.homelabproject.cc/d/foxipan/vGPU/19.5/NVIDIA-GRID-Linux-KVM-580.159.01-580.159.03-582.53/Guest_Drivers/NVIDIA-Linux-x86_64-580.159.03-grid.run",
                  "this_pack_grid_run": "NVIDIA-Linux-x86_64-580.159.03-grid.run",
                  "this_pack_nvlts_version": "",
                  "this_pack_enable_nvlts": True,
              },
              {
                  "enabled": os.environ["BUILD_535"] == "true",
                  "this_pack_version": "535.309.01-1",
                  "this_pack_nvidia_driver_version": "535.309.01",
                  "this_pack_nvidia_driver_page_url": "https://www.nvidia.cn/drivers/details/267227/",
                  "this_pack_grid_download_url": "https://alist.homelabproject.cc/d/foxipan/vGPU/16.14/NVIDIA-GRID-Linux-KVM-535.309.01-539.72/Guest_Drivers/NVIDIA-Linux-x86_64-535.309.01-grid.run",
                  "this_pack_grid_run": "NVIDIA-Linux-x86_64-535.309.01-grid.run",
                  "this_pack_nvlts_version": "",
                  "this_pack_enable_nvlts": False,
              },
          ]
          kernels = [
              "6.18.18-trim-427-amd64",
              "6.18.18-trim-570-amd64",
              "6.18.18-trim-587-amd64",
              "6.18.18-trim-717-amd64",
              "6.18.18.c788-trim-amd64",
              "6.18.18.c877-trim-amd64",
              "6.18.18.c938-trim-amd64",
          ]
          selected = [driver for driver in drivers if driver["enabled"]]
          if not selected:
              print("At least one NVIDIA driver version must be selected.")
              raise SystemExit(1)

          def public_driver_fields(driver):
              return {
                  key: value
                  for key, value in driver.items()
                  if key != "enabled"
              }

          driver_matrix = [public_driver_fields(driver) for driver in selected]
          nvlts_matrix = [
              public_driver_fields(driver)
              for driver in selected
              if driver["this_pack_enable_nvlts"]
          ]
          user_matrix = [
              {
                  "this_pack_version": driver["this_pack_version"],
                  "this_pack_nvidia_driver_version": driver["this_pack_nvidia_driver_version"],
                  "this_pack_nvidia_driver_page_url": driver["this_pack_nvidia_driver_page_url"],
                  "this_pack_grid_run": driver["this_pack_grid_run"],
                  "this_pack_enable_nvlts": driver["this_pack_enable_nvlts"],
              }
              for driver in selected
          ]
          release_assets_matrix = []
          for driver in selected:
              for kernel in kernels:
                  release_assets_matrix.append({
                      "this_pack_version": driver["this_pack_version"],
                      "package_name_prefix": "appstore.driver.gpu.nvidia.ko",
                      "package_name_suffix": kernel,
                  })
              release_assets_matrix.append({
                  "this_pack_version": driver["this_pack_version"],
                  "package_name_prefix": "appstore.driver.gpu.nvidia.ko",
                  "package_name_suffix": "chroot-amd64",
              })
              release_assets_matrix.append({
                  "this_pack_version": driver["this_pack_version"],
                  "package_name_prefix": "appstore.driver.gpu.nvidia.user",
                  "package_name_suffix": "x86",
              })

          selected_versions = [
              driver["this_pack_nvidia_driver_version"]
              for driver in selected
          ]
          selected_driver_regex = "|".join(
              version.replace(".", "[.]")
              for version in selected_versions
          )
          selected_driver_summary = ", ".join(selected_versions)

          outputs = {
              "build_580": str(os.environ["BUILD_580"] == "true").lower(),
              "build_535": str(os.environ["BUILD_535"] == "true").lower(),
              "driver_matrix": json.dumps({"include": driver_matrix}, separators=(",", ":")),
              "nvlts_matrix": json.dumps({"include": nvlts_matrix}, separators=(",", ":")),
              "user_matrix": json.dumps({"include": user_matrix}, separators=(",", ":")),
              "release_assets_matrix": json.dumps({"include": release_assets_matrix}, separators=(",", ":")),
              "selected_driver_regex": selected_driver_regex,
              "selected_driver_summary": selected_driver_summary,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=out)

          print(f"Selected NVIDIA driver versions: {selected_driver_summary}")
          print(f"Build 580.159.03: {outputs['build_580']}")
          print(f"Build 535.309.01: {outputs['build_535']}")
          PY

  prepare_driver_package:
    uses: ./.github/workflows/nvidia-grid-kernel-src.yml
    secrets: inherit
    needs:
      - plan_build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.driver_matrix) }}
    with:
      driver_pkg_artifact: nvidia-grid-kernel-src-${{ matrix.this_pack_nvidia_driver_version }}
      firmware_artifact: nvidia-grid-firmware-${{ matrix.this_pack_nvidia_driver_version }}
      runfile_artifact: nvidia-grid-runfile-${{ matrix.this_pack_nvidia_driver_version }}
      this_pack_grid_download_url: ${{ matrix.this_pack_grid_download_url }}
      this_pack_grid_run: ${{ matrix.this_pack_grid_run }}

  prepare_nvlts:
    if: ${{ needs.plan_build.outputs.build_580 == 'true' }}
    uses: ./.github/workflows/nvlts.yml
    secrets: inherit
    needs:
      - plan_build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.nvlts_matrix) }}
    with:
      nvlts_version: ${{ matrix.this_pack_nvlts_version }}
      nvlts_artifact: nvlts-${{ matrix.this_pack_nvidia_driver_version }}

  package_kernel_space:
    if: ${{ needs.prepare_driver_package.result == 'success' }}
    uses: ./.github/workflows/kernel_space.yml
    secrets: inherit
    needs:
      - prepare_driver_package
      - plan_build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.driver_matrix) }}
    with:
      kernel_module_package_name: appstore.driver.gpu.nvidia.ko
      this_pack_version: ${{ matrix.this_pack_version }}
      this_pack_nvidia_driver_version: ${{ matrix.this_pack_nvidia_driver_version }}
      this_pack_nvidia_driver_page_url: ${{ matrix.this_pack_nvidia_driver_page_url }}
      driver_pkg_artifact: nvidia-grid-kernel-src-${{ matrix.this_pack_nvidia_driver_version }}
      firmware_artifact: nvidia-grid-firmware-${{ matrix.this_pack_nvidia_driver_version }}
      enable_ccache: ${{ inputs.enable_ccache }}

  prune_ccache:
    if: ${{ always() && inputs.enable_ccache && needs.package_kernel_space.result == 'success' }}
    needs:
      - package_kernel_space
      - plan_build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep latest two kernel ccache entries per kernel and driver
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPO"
          echo "Authenticated as: $(gh api user --jq .login 2>/dev/null || echo unknown)"
          echo "Listing kernel ccache entries..."

          caches_file="$(mktemp)"
          delete_file="$(mktemp)"

          gh cache list --key ccache-6.18.18 --limit 1000 --json id,key,createdAt,lastAccessedAt,sizeInBytes > "$caches_file"

          cache_count="$(jq 'length' "$caches_file")"
          echo "Found $cache_count cache entries with kernel ccache prefix."
          jq -r '
            sort_by(.key)
            | .[]
            | "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$caches_file"

          jq -c '
            map(select(.key | test("^ccache-6[.]18[.]18(-trim-(427|570|587|717)|[.]c(788|877|938)-trim)-amd64-(${{ needs.plan_build.outputs.selected_driver_regex }})-[0-9]+-[0-9]+$")))
            | sort_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | group_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | map(sort_by(.createdAt) | reverse | .[2:][]?)
            | .[]
          ' "$caches_file" > "$delete_file"

          delete_count="$(jq -s 'length' "$delete_file")"
          if [ "$delete_count" -eq 0 ]; then
            echo "No old ccache entries to delete."
            exit 0
          fi

          echo "Deleting $delete_count old ccache entries. Keeping latest two entries per key prefix."
          jq -r '
            "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$delete_file"

          while IFS= read -r cache; do
            [ -n "$cache" ] || continue
            cache_id="$(jq -r '.id' <<< "$cache")"
            cache_key="$(jq -r '.key' <<< "$cache")"
            cache_created_at="$(jq -r '.createdAt' <<< "$cache")"
            if ! grep -Eq '^ccache-6[.]18[.]18(-trim-(427|570|587|717)|[.]c(788|877|938)-trim)-amd64-(${{ needs.plan_build.outputs.selected_driver_regex }})-[0-9]+-[0-9]+$' <<< "$cache_key"; then
              echo "::warning::Skip non-kernel-ccache key=$cache_key"
              continue
            fi
            echo "::group::Delete cache id=$cache_id key=$cache_key"
            echo "createdAt=$cache_created_at"
            if output="$(gh cache delete "$cache_id" 2>&1)"; then
              echo "Deleted cache id=$cache_id key=$cache_key"
            else
              status="$?"
              echo "::warning::Failed to delete cache id=$cache_id key=$cache_key exit=$status"
              echo "$output"
            fi
            echo "::endgroup::"
          done < "$delete_file"

  package_user_space:
    if: ${{ always() && needs.prepare_driver_package.result == 'success' && (needs.prepare_nvlts.result == 'success' || needs.prepare_nvlts.result == 'skipped') }}
    uses: ./.github/workflows/user_space.yml
    secrets: inherit
    needs:
      - prepare_driver_package
      - prepare_nvlts
      - plan_build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.user_matrix) }}
    with:
      this_pack_version: ${{ matrix.this_pack_version }}
      this_pack_nvidia_driver_version: ${{ matrix.this_pack_nvidia_driver_version }}
      this_pack_nvidia_driver_page_url: ${{ matrix.this_pack_nvidia_driver_page_url }}
      this_pack_grid_run: ${{ matrix.this_pack_grid_run }}
      runfile_artifact: nvidia-grid-runfile-${{ matrix.this_pack_nvidia_driver_version }}
      nvlts_artifact: nvlts-${{ matrix.this_pack_nvidia_driver_version }}
      enable_nvlts: ${{ matrix.this_pack_enable_nvlts }}
      manifest_platform: x86

  create_release:
    if: ${{ always() && inputs.make_release && needs.package_kernel_space.result == 'success' && needs.package_user_space.result == 'success' }}
    needs:
      - package_kernel_space
      - package_user_space
      - plan_build
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_title: ${{ steps.vars.outputs.release_title }}
    steps:
      - name: Prepare release tag
        id: vars
        run: |
          release_title="$(TZ=Asia/Shanghai date '+%Y.%m.%d %H:%M:%S')"
          release_tag="$(printf '%s' "${release_title}" | tr ' :' '--')"
          {
            echo "release_title=${release_title}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Release title: ${release_title}"
          echo "Release tag: ${release_tag}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="$(mktemp)"
          cat > "$release_notes" <<'EOF'
          Build commit: ${{ github.sha }}
          Build ref: ${{ github.ref_name }}
          Build 580.159.03: ${{ needs.plan_build.outputs.build_580 }}
          Build 535.309.01: ${{ needs.plan_build.outputs.build_535 }}
          Selected NVIDIA drivers: ${{ needs.plan_build.outputs.selected_driver_summary }}
          EOF
          sed -i 's/^          //' "$release_notes"

          if gh release view "${{ steps.vars.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${{ steps.vars.outputs.release_tag }} already exists, updating notes."
            gh release edit "${{ steps.vars.outputs.release_tag }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "fnnas.appstore.driver.gpu.nvidia.grid ${{ steps.vars.outputs.release_title }}" \
              --notes-file "$release_notes" \
              --prerelease
          else
            gh release create "${{ steps.vars.outputs.release_tag }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "fnnas.appstore.driver.gpu.nvidia.grid ${{ steps.vars.outputs.release_title }}" \
              --notes-file "$release_notes" \
              --prerelease
          fi

  upload_release_assets:
    if: ${{ inputs.make_release && needs.create_release.result == 'success' }}
    needs:
      - create_release
      - plan_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_build.outputs.release_assets_matrix) }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.package_name_prefix }}-${{ matrix.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz
          path: release-assets/

      - name: Rename package extension to fpk
        run: |
          set -euo pipefail
          package_name="${{ matrix.package_name_prefix }}-${{ matrix.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz"
          fpk_name="${package_name}.fpk"
          echo "Renaming ${package_name} to ${fpk_name}"
          mv "release-assets/${package_name}" "release-assets/${fpk_name}"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."
          package_name="${{ matrix.package_name_prefix }}-${{ matrix.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz.fpk"
          echo "Uploading ${package_name}"
          gh release upload "${{ needs.create_release.outputs.release_tag }}" "release-assets/${package_name}" --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Upload completed!"

  verify_release_assets:
    if: ${{ inputs.make_release }}
    needs:
      - upload_release_assets
      - create_release
    runs-on: ubuntu-latest
    steps:
      - name: Verify Uploaded Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets for ${{ needs.create_release.outputs.release_tag }}:"
          gh release view "${{ needs.create_release.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name'
