name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Do you want to create a release?"
        required: true
        type: boolean
        default: false
      enable_ccache:
        description: "Do you want to enable ccache?"
        required: true
        type: boolean
        default: true

env:
  proj_name: "appstore.driver.gpu.nvidia.grid"
  kernel_module_package_name: "appstore.driver.gpu.nvidia.ko"
  this_pack_version: "580.159.03-2"
  this_pack_nvidia_driver_version: "580.159.03"
  this_pack_nvidia_driver_url: "https://www.nvidia.com/en-us/drivers/details/267577/"
  this_pack_grid_url: "https://alist.homelabproject.cc/d/foxipan/vGPU/19.5/NVIDIA-GRID-Linux-KVM-580.159.01-580.159.03-582.53/Guest_Drivers/NVIDIA-Linux-x86_64-580.159.03-grid.run"
  this_pack_grid_run: "NVIDIA-Linux-x86_64-580.159.03-grid.run"
  this_pack_nvlts_version: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      proj_name: ${{ steps.vars.outputs.proj_name }}
      kernel_module_package_name: ${{ steps.vars.outputs.kernel_module_package_name }}
      this_pack_version: ${{ steps.vars.outputs.this_pack_version }}
      this_pack_nvidia_driver_version: ${{ steps.vars.outputs.this_pack_nvidia_driver_version }}
      this_pack_nvidia_driver_url: ${{ steps.vars.outputs.this_pack_nvidia_driver_url }}
      this_pack_grid_url: ${{ steps.vars.outputs.this_pack_grid_url }}
      this_pack_grid_run: ${{ steps.vars.outputs.this_pack_grid_run }}
      this_pack_nvlts_version: ${{ steps.vars.outputs.this_pack_nvlts_version }}
    steps:
      - name: Prepare build variables
        id: vars
        run: |
          {
            echo "proj_name=${{ env.proj_name }}"
            echo "kernel_module_package_name=${{ env.kernel_module_package_name }}"
            echo "this_pack_version=${{ env.this_pack_version }}"
            echo "this_pack_nvidia_driver_version=${{ env.this_pack_nvidia_driver_version }}"
            echo "this_pack_nvidia_driver_url=${{ env.this_pack_nvidia_driver_url }}"
            echo "this_pack_grid_url=${{ env.this_pack_grid_url }}"
            echo "this_pack_grid_run=${{ env.this_pack_grid_run }}"
            echo "this_pack_nvlts_version=${{ env.this_pack_nvlts_version }}"
          } >> "$GITHUB_OUTPUT"

  prepare_driver_package:
    uses: ./.github/workflows/nvidia-grid-kernel-src.yml
    secrets: inherit
    needs:
      - setup
    with:
      driver_pkg_artifact: nvidia-grid-kernel-src
      firmware_artifact: nvidia-grid-firmware
      runfile_artifact: nvidia-grid-runfile
      this_pack_grid_url: ${{ needs.setup.outputs.this_pack_grid_url }}
      this_pack_grid_run: ${{ needs.setup.outputs.this_pack_grid_run }}

  prepare_nvlts:
    uses: ./.github/workflows/nvlts.yml
    secrets: inherit
    needs:
      - setup
    with:
      nvlts_version: ${{ needs.setup.outputs.this_pack_nvlts_version }}
      nvlts_artifact: nvlts

  package_kernel_space:
    uses: ./.github/workflows/kernel_space.yml
    secrets: inherit
    needs:
      - setup
      - prepare_driver_package
    with:
      kernel_module_package_name: ${{ needs.setup.outputs.kernel_module_package_name }}
      this_pack_version: ${{ needs.setup.outputs.this_pack_version }}
      this_pack_nvidia_driver_version: ${{ needs.setup.outputs.this_pack_nvidia_driver_version }}
      this_pack_nvidia_driver_url: ${{ needs.setup.outputs.this_pack_nvidia_driver_url }}
      driver_pkg_artifact: nvidia-grid-kernel-src
      firmware_artifact: nvidia-grid-firmware
      enable_ccache: ${{ inputs.enable_ccache }}

  prune_ccache:
    if: ${{ always() && inputs.enable_ccache }}
    needs:
      - package_kernel_space
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep latest two ccache entries per kernel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPO"
          echo "Authenticated as: $(gh api user --jq .login 2>/dev/null || echo unknown)"
          echo "Listing ccache entries..."

          caches_file="$(mktemp)"
          delete_file="$(mktemp)"

          gh cache list --key ccache- --limit 1000 --json id,key,createdAt,lastAccessedAt,sizeInBytes > "$caches_file"

          cache_count="$(jq 'length' "$caches_file")"
          echo "Found $cache_count cache entries with ccache- prefix."
          jq -r '
            sort_by(.key)
            | .[]
            | "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$caches_file"

          jq -c '
            map(select(.key | test("^ccache-.+-[0-9]+-[0-9]+$")))
            | group_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | map(sort_by(.createdAt) | reverse | .[2:][]?)
            | .[]
          ' "$caches_file" > "$delete_file"

          delete_count="$(jq -s 'length' "$delete_file")"
          if [ "$delete_count" -eq 0 ]; then
            echo "No old ccache entries to delete."
            exit 0
          fi

          echo "Deleting $delete_count old ccache entries. Keeping latest two entries per kernel key prefix."
          jq -r '
            "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$delete_file"

          while IFS= read -r cache; do
            [ -n "$cache" ] || continue
            cache_id="$(jq -r '.id' <<< "$cache")"
            cache_key="$(jq -r '.key' <<< "$cache")"
            cache_created_at="$(jq -r '.createdAt' <<< "$cache")"
            echo "::group::Delete cache id=$cache_id key=$cache_key"
            echo "createdAt=$cache_created_at"
            if output="$(gh cache delete "$cache_id" 2>&1)"; then
              echo "Deleted cache id=$cache_id key=$cache_key"
            else
              status="$?"
              echo "::warning::Failed to delete cache id=$cache_id key=$cache_key exit=$status"
              echo "$output"
            fi
            echo "::endgroup::"
          done < "$delete_file"

  package_user_space:
    uses: ./.github/workflows/user_space.yml
    secrets: inherit
    needs:
      - setup
      - prepare_driver_package
      - prepare_nvlts
    with:
      this_pack_version: ${{ needs.setup.outputs.this_pack_version }}
      this_pack_nvidia_driver_version: ${{ needs.setup.outputs.this_pack_nvidia_driver_version }}
      this_pack_nvidia_driver_url: ${{ needs.setup.outputs.this_pack_nvidia_driver_url }}
      this_pack_grid_run: ${{ needs.setup.outputs.this_pack_grid_run }}
      runfile_artifact: nvidia-grid-runfile
      nvlts_artifact: nvlts
      manifest_platform: x86

  create_release:
    if: ${{ inputs.make_release }}
    needs:
      - package_kernel_space
      - package_user_space
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.this_pack_version }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${{ env.this_pack_version }} already exists, skipping create."
          else
            gh release create "${{ env.this_pack_version }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "fnnas.appstore.driver.gpu.nvidia.grid-${{ env.this_pack_version }}" \
              --prerelease
          fi

  upload_release_assets:
    if: ${{ inputs.make_release }}
    needs:
      - create_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name_prefix: "appstore.driver.gpu.nvidia.ko"
            package_name_suffix: "6.18.18-trim-427-amd64"
          - package_name_prefix: "appstore.driver.gpu.nvidia.ko"
            package_name_suffix: "6.18.18-trim-570-amd64"
          - package_name_prefix: "appstore.driver.gpu.nvidia.ko"
            package_name_suffix: "6.18.18-trim-587-amd64"
          - package_name_prefix: "appstore.driver.gpu.nvidia.user"
            package_name_suffix: "x86"
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.package_name_prefix }}-${{ env.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz
          path: release-assets/

      - name: Rename package extension to fpk
        run: |
          set -euo pipefail
          package_name="${{ matrix.package_name_prefix }}-${{ env.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz"
          fpk_name="${package_name}.fpk"
          echo "Renaming ${package_name} to ${fpk_name}"
          mv "release-assets/${package_name}" "release-assets/${fpk_name}"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."
          package_name="${{ matrix.package_name_prefix }}-${{ env.this_pack_version }}-${{ matrix.package_name_suffix }}.tgz.fpk"
          echo "Uploading ${package_name}"
          gh release upload "${{ env.this_pack_version }}" "release-assets/${package_name}" --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Upload completed!"

  verify_release_assets:
    if: ${{ inputs.make_release }}
    needs:
      - upload_release_assets
    runs-on: ubuntu-latest
    steps:
      - name: Verify Uploaded Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_version }}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name'
