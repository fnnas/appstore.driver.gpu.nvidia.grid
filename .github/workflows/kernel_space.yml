name: Kernel Space

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      kernel_module_package_name:
        required: true
        type: string
      this_pack_version:
        required: true
        type: string
      this_pack_nvidia_driver_version:
        required: true
        type: string
      this_pack_nvidia_driver_page_url:
        required: true
        type: string
      driver_pkg_artifact:
        required: true
        type: string
      firmware_artifact:
        required: true
        type: string
      enable_ccache:
        required: false
        type: boolean
        default: true

jobs:
  build_and_pack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.18.18-trim-427-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-427-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18-trim-717-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-717-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c788-trim-amd64"
            kernel_ver: "6.18.18.c788-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c788-trim-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c877-trim-amd64"
            kernel_ver: "6.18.18.c877-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c877-trim-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c938-trim-amd64"
            kernel_ver: "6.18.18.c938-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c938-trim-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c952-trim-amd64"
            kernel_ver: "6.18.18.c952-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c952-trim-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c1032-trim-amd64"
            kernel_ver: "6.18.18.c1032-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1032-trim-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18.c1078-trim-amd64"
            kernel_ver: "6.18.18.c1078-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1078-trim-amd64"
            manifest_platform: "x86"
    container:
      image: ${{ matrix.container_image }}
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.kernel_name }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
      CCACHE_KEY_PREFIX: ccache-${{ matrix.kernel_name }}-${{ inputs.this_pack_nvidia_driver_version }}
      CCACHE_KEY: ccache-${{ matrix.kernel_name }}-${{ inputs.this_pack_nvidia_driver_version }}-${{ github.run_id }}-${{ github.run_attempt }}
      CCACHE_RESTORE_PREFIX: ccache-${{ matrix.kernel_name }}-${{ inputs.this_pack_nvidia_driver_version }}-
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Restore ccache
        if: ${{ inputs.enable_ccache }}
        id: restore_ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            ${{ env.CCACHE_RESTORE_PREFIX }}

      - name: Set up ccache
        if: ${{ inputs.enable_ccache }}
        id: setup_ccache
        shell: bash
        run: |
          apt-get update
          apt-get install -y ccache
          mkdir -p "$CCACHE_DIR" "$GITHUB_WORKSPACE/ccache-bin"
          ccache_path="$(command -v ccache)"
          declare -A seen=()
          while IFS= read -r compiler; do
            case "$compiler" in
              gcc|g++|cc|c++|gcc-[0-9]*|g++-[0-9]*|cc-[0-9]*|c++-[0-9]*|*-gcc|*-g++|*-cc|*-c++|*-gcc-[0-9]*|*-g++-[0-9]*|*-cc-[0-9]*|*-c++-[0-9]*)
                [[ -n "${seen[$compiler]+x}" ]] && continue
                compiler_path="$(command -v "$compiler" || true)"
                [[ -x "$compiler_path" ]] || continue
                ln -sf "$ccache_path" "$GITHUB_WORKSPACE/ccache-bin/$compiler"
                seen[$compiler]=1
                ;;
            esac
          done < <(compgen -c | sort -u)
          echo "$GITHUB_WORKSPACE/ccache-bin" >> "$GITHUB_PATH"
          ccache --version
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=path="$PATH"
          ccache --zero-stats
          ccache --show-config
          echo "ccache wrappers:"
          find "$GITHUB_WORKSPACE/ccache-bin" -maxdepth 1 -type l -printf '%f -> %l\n' | sort

      - name: Download NVIDIA kernel source
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.driver_pkg_artifact }}
          path: .

      - name: Extract NVIDIA kernel source
        run: |
          rm -rf kernel
          tar zxf nvidia-kernel-src.tgz

      - name: Build NVIDIA kernel modules
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "compiler resolution before build:"
            for compiler in cc gcc g++ c++ x86_64-linux-gnu-gcc x86_64-linux-gnu-g++; do
              if command -v "$compiler" >/dev/null 2>&1; then
                echo "$compiler -> $(command -v "$compiler")"
              fi
            done
          fi
          cd kernel
          make -j"$(nproc)"

      - name: Show nvidia.ko modinfo
        run: |
          module_file="$(find ./kernel -name nvidia.ko -type f -print -quit)"
          test -n "$module_file"
          echo "module file: $module_file"
          modinfo "$module_file"

      - name: Show ccache stats
        if: ${{ always() && inputs.enable_ccache }}
        run: |
          ccache --show-stats || true

      - name: Save ccache
        if: ${{ always() && inputs.enable_ccache && steps.setup_ccache.outcome == 'success' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}

      - name: Collect built kernel modules
        run: |
          mkdir -p app/app/${{ inputs.kernel_module_package_name }}_${{ env.kernel_name }}
          find ./kernel -name '*.ko' -type f -print -exec cp {} ./app/app/${{ inputs.kernel_module_package_name }}_${{ env.kernel_name }}/ \;
          test -n "$(find ./app/app/${{ inputs.kernel_module_package_name }}_${{ env.kernel_name }} -name '*.ko' -type f -print -quit)"
          ls -la ./app/app/${{ inputs.kernel_module_package_name }}_${{ env.kernel_name }}/

      - name: Restore NVIDIA firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.firmware_artifact }}
          path: app/app/firmware/

      - name: Render kernel package manifest
        run: |
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/manifest
          sed "s|this_pack_nvidia_driver_page_url|${{ inputs.this_pack_nvidia_driver_page_url }}|g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_platform/${{ matrix.manifest_platform }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_kernel/${{ env.kernel_name }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/cmd/common
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_kernel_space/wizard/install
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/wizard/install
          sed "s/this_pack_manifest_kernel/${{ env.kernel_name }}/g" -i ./package_kernel_space/wizard/install

      - name: Create kernel app payload archive
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../package_kernel_space/

      - name: Create kernel-space package archive
        run: |
          tar zcvf nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz package_kernel_space

      - name: Upload kernel-space package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz
          path: nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz

  pack_chroot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download NVIDIA kernel source
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.driver_pkg_artifact }}
          path: .

      - name: Add NVIDIA kernel source to package payload
        run: |
          set -euo pipefail
          mkdir -p app/app/nvidia-kernel-source
          tar zxf nvidia-kernel-src.tgz -C app/app/nvidia-kernel-source
          test -f app/app/nvidia-kernel-source/kernel/Makefile
          if find app/app/nvidia-kernel-source -name '*.ko' -print -quit | grep -q .; then
            echo "The chroot package must not contain prebuilt kernel modules." >&2
            exit 1
          fi

      - name: Restore NVIDIA firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.firmware_artifact }}
          path: app/app/firmware/

      - name: Render chroot kernel package metadata
        run: |
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/manifest
          sed "s|this_pack_nvidia_driver_page_url|${{ inputs.this_pack_nvidia_driver_page_url }}|g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_platform/x86/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_kernel/chroot-amd64（本机编译）/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/cmd/common
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_kernel_space/wizard/install
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/wizard/install
          sed "s/this_pack_manifest_kernel/chroot-amd64（本机编译）/g" -i ./package_kernel_space/wizard/install

      - name: Verify chroot package contains no prebuilt modules
        run: |
          set -euo pipefail
          if find app/app -name '*.ko' -print -quit | grep -q .; then
            echo "The chroot package payload contains a prebuilt kernel module." >&2
            exit 1
          fi

      - name: Create chroot kernel app payload archive
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../package_kernel_space/

      - name: Create chroot kernel-space package archive
        run: |
          tar zcvf nvidia.ko-${{ inputs.this_pack_version }}-chroot-amd64.tgz package_kernel_space

      - name: Upload chroot kernel-space package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvidia.ko-${{ inputs.this_pack_version }}-chroot-amd64.tgz
          path: nvidia.ko-${{ inputs.this_pack_version }}-chroot-amd64.tgz
