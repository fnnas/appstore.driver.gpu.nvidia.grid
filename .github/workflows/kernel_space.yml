name: Kernel Space

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      proj_name:
        required: true
        type: string
        default: "appstore.driver.gpu.nvidia.ko"
      this_pack_version:
        required: true
        type: string
      this_pack_nvidia_driver_version:
        required: true
        type: string
      this_pack_nvidia_driver_url:
        required: true
        type: string
      driver_pkg_artifact:
        required: true
        type: string
        default: "nvidia-grid-kernel-src"
      firmware_artifact:
        required: true
        type: string
        default: "nvidia-grid-firmware"

jobs:
  build_and_pack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
            manifest_platform: "x86"
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
            manifest_platform: "x86"
    container:
      image: ${{ matrix.container_image }}
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download NVIDIA kernel source
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.driver_pkg_artifact }}
          path: .

      - name: Extract NVIDIA kernel source
        run: |
          rm -rf kernel
          tar zxf nvidia-kernel-src.tgz

      - name: Build NVIDIA kernel modules
        run: |
          cd kernel
          make -j"$(nproc)"

      - name: Copy ko
        run: |
          mkdir -p app/app/${{ inputs.proj_name }}_${{ env.kernel_name }}
          find ./kernel -name '*.ko' -type f -print -exec cp {} ./app/app/${{ inputs.proj_name }}_${{ env.kernel_name }}/ \;
          test -n "$(find ./app/app/${{ inputs.proj_name }}_${{ env.kernel_name }} -name '*.ko' -type f -print -quit)"
          ls -la ./app/app/${{ inputs.proj_name }}_${{ env.kernel_name }}/

      - name: Restore NVIDIA firmware
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.firmware_artifact }}
          path: app/app/firmware/

      - name: Update package manifest
        run: |
          sed "s/this_pack_manifest_version/${{ inputs.this_pack_version }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/manifest
          sed "s|this_pack_nvidia_driver_url|${{ inputs.this_pack_nvidia_driver_url }}|g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_platform/${{ matrix.manifest_platform }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_manifest_kernel/${{ env.kernel_name }}/g" -i ./package_kernel_space/manifest
          sed "s/this_pack_nvidia_driver_version/${{ inputs.this_pack_nvidia_driver_version }}/g" -i ./package_kernel_space/cmd/common

      - name: Pack app.tgz
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../package_kernel_space/

      - name: Pack package
        run: |
          tar zcvf appstore.driver.gpu.nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz package_kernel_space

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: appstore.driver.gpu.nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz
          path: appstore.driver.gpu.nvidia.ko-${{ inputs.this_pack_version }}-${{ env.kernel_name }}.tgz
